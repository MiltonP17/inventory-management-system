<!DOCTYPE html>
<html lang="en">
   <html xmlns:th="https://www.thymeleaf.org">
      <head>
         <meta charset="UTF-8">
         <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
         <!-- Bootstrap CSS -->
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
         <title>Part Form</title>
      </head>
      <body>
         <div class="container">
            <h1>Inhouse Part Detail</h1>
            <form action="#" th:action="@{/showFormAddInPart}" th:object="${inhousepart}" method="POST"}>
               <p><input type="hidden" th:field="*{id}"/></p>
               <p><input type="text" th:field="*{name}" placeholder="Name" class="form-control mb-4 col-4"/></p>
               <p><input type="text" path="price" th:field="*{price}" placeholder= "Price" class="form-control mb-4 col-4"/></p>
               <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price Error</p>
               <p><input type="text" path="inv" th:field="*{inv}" placeholder="Inventory" class="form-control mb-4 col-4"/></p>
               <div class="text-danger" th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}"></div>
               <p><input type="text" th:field="*{partId}" placeholder="Part ID" class="form-control mb-4 col-4"/></p>
               <p><label for="minInv" class="form-label">Minimum Inventory</label>
                  <input id="minInv" type="number" class="form-control" th:field="*{minInv}" min="0" required>
               </p>
               <div class="text-danger" th:if="${#fields.hasErrors('minInv')}" th:errors="*{minInv}"></div>
               <p><label for="maxInv" class="form-label">Maximum Inventory</label>
                  <input id="maxInv" type="number" class="form-control" th:field="*{maxInv}" min="0" required>
               </p>
               <div class="text-danger" th:if="${#fields.hasErrors('maxInv')}" th:errors="*{maxInv}"></div>
               <!-- Global errors for “min ≤ max” / inventory bounds -->
               <div class="text-danger mt-2" th:if="${#fields.hasGlobalErrors()}"
                  th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
               <p><input type="submit" value="Submit" /></p>
            </form>
            <p>
               <errors path="price" cssClass=""error/>
            <p>
               <a href="http://localhost:8080/">Link
               to Main Screen</a>
         </div>
      </body>
   </html>
