<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
      <meta charset="UTF-8">
      <!-- Required meta tags -->
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <!-- Bootstrap CSS -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
         integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
      <title>Patch & Switch Supply Co.</title>
   </head>
   <body>
      <nav class="container-fluid navbar navbar-expand-lg navbar-light bg-light shadow-sm mb-4">
         <a class="navbar-brand d-flex align-items-center" th:href="@{/mainscreen}">
         <img src="https://icons.getbootstrap.com/assets/icons/hdd-rack.svg"
            width="32" height="32" class="me-2" alt="Server Rack Logo">
         <span class="fw-bold">Patch & Switch Supply Co.</span>
         </a>
         <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
         <span class="navbar-toggler-icon"></span>
         </button>
         <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
               <li class="nav-item">
                  <a class="nav-link active" th:href="@{/mainscreen}">Home</a>
               </li>
               <li class="nav-item">
                  <a class="nav-link" th:href="@{/about}">About</a>
               </li>
            </ul>
         </div>
      </nav>
      <div class="container">
         <!--  Notification alert  -->
         <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${msg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
         </div>
         <div th:if="${err}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${err}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
         </div>
         <h1>Shop</h1>
         <hr>
         <h2>Parts</h2>
         <form th:action="@{/mainscreen}">
            Filter: <input type="text" name="partkeyword" id="partkeyword" size="50" th:value="${partkeyword}" required />
            &nbsp;
            <input type="submit" value="Search" />
            &nbsp;
            <input type="button" value="Clear" id="btnClearPart" onclick="clearSearch()" />
         </form>
         <br><br>
         <a th:href="@{/showFormAddInPart}" class="btn btn-primary btn-sm mb-3">Add Inhouse Part</a>
         <a th:href="@{/showFormAddOutPart}" class="btn btn-primary btn-sm mb-3">Add Outsourced Part</a>
         <table class="table table-bordered table-striped">
            <thead class="thead-dark">
               <tr>
                  <th>Name</th>
                  <th>Price</th>
                  <th>Inventory</th>
                  <th>Action</th>
               </tr>
            </thead>
            <tbody>
               <tr th:each="tempPart : ${parts}">
                  <td th:text="${tempPart.name}">1</td>
				  <td th:text="${'$' + #numbers.formatDecimal(tempPart.price, 1, 2)}">1</td>
                  <td th:text="${tempPart.inv}">1</td>
                  <td>
                     <a th:href="@{/showPartFormForUpdate(partID=${tempPart.id})}" class="btn btn-primary btn-sm mb-3">Update</a>
                     <a th:href="@{/deletepart(partID=${tempPart.id})}" class="btn btn-primary btn-sm mb-3"
                        onclick="if(!(confirm('Are you sure you want to delete this part?')))return false">Delete</a>
                  </td>
               </tr>
            </tbody>
         </table>
         <h2>Products</h2>
         <form th:action="@{/mainscreen}">
            Filter: <input type="text" name="productkeyword" id="productkeyword" size="50" th:value="${productkeyword}" required />
            &nbsp;
            <input type="submit" value="Search" />
            &nbsp;
            <input type="button" value="Clear" id="btnClearProduct" onclick="clearSearch()" />
         </form>
         <script type="text/javascript">
            function clearSearch() {
                window.location = "[[@{/}]]";
            }
         </script>
         <br><br>
         <a th:href="@{/showFormAddProduct}" class="btn btn-primary btn-sm mb-3">Add Product</a>
         <table class="table table-bordered table-striped">
            <thead class="thead-dark">
               <tr>
                  <th>Name</th>
                  <th>Price</th>
                  <th>Inventory</th>
                  <th>Action</th>
               </tr>
            </thead>
            <tbody>
               <tr th:each="tempProduct : ${products}">
                  <td th:text="${tempProduct.name}">1</td>
				  <td th:text="${'$' + #numbers.formatDecimal(tempProduct.price, 1, 2)}">1</td>
                  <td th:text="${tempProduct.inv}">1</td>
                  <td>
                     <!-- Buy now button -->
                     <form th:action="@{'/product/' + ${tempProduct.id} + '/buy'}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-sm btn-success">Buy Now</button>
                     </form>
                     <a th:href="@{/showProductFormForUpdate(productID=${tempProduct.id})}" class="btn btn-primary btn-sm mb-3">Update</a>
                     <a th:href="@{/deleteproduct(productID=${tempProduct.id})}" class="btn btn-primary btn-sm mb-3"
                        onclick="if(!(confirm('Are you sure you want to delete this product?')))return false">Delete</a>
                  </td>
               </tr>
            </tbody>
         </table>
      </div>
   </body>
</html>
